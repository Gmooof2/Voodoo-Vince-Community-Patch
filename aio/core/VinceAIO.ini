; Vince AIO settings (keep this line first). Read when the game starts. Uninstall: delete X3DAudio1_7.dll.
; One section per part: [VinceFix] pacing, [VinceAudio] sound, [VinceSteam] heat shimmer.
[VinceFix]
; Pacing off: FrameCap=0 and PresentHold=0.
; Frame cap in FPS (0 = off). Steps aside by itself while a driver or RTSS cap is on.
FrameCap=60
; Hold each frame so frames reach the screen evenly: auto, 1-12 (ms), or 0 = off.
PresentHold=auto
; Send the frame to the GPU before the hold: auto (only with FrameCap), 1 = always, 0 = never.
HoldFlush=auto
; Apply changes to this file while the game runs: 1 = on, 0 = off.
LiveReload=0
[VinceAudio]
; Master volume, 0 to 1 (1.0 = the original game volume).
MasterVolume=0.5
[VinceSteam]
; 0 turns the heat shimmer off
enabled=1
; percent of the Xbox bend (2 pixels of a 480-line screen); 400 makes it easy to spot when testing
strength=100
; 1 draws every shimmer as a red disc (same place, size and depth test), for finding them
debug=0
; 1 draws shimmers at the end of the scene (correct); 0 in the alpha pass (old, for comparison)
late=1
